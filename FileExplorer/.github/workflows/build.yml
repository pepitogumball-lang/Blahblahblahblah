name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos al wrapper de Gradle
        run: chmod +x FileExplorer/gradlew

      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compilar APK debug
        working-directory: FileExplorer
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FileExplorer-debug-apk
          path: FileExplorer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Mostrar información del APK
        working-directory: FileExplorer
        run: |
          echo "=== APK generado ==="
          ls -lh app/build/outputs/apk/debug/
